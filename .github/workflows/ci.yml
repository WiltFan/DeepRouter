name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Cross-compile Windows
        if: runner.os == 'Linux'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/cli.test.exe" ./internal/cli
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/userenv.test.exe" ./internal/userenv
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/deeprouter-amd64.exe" .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/deeprouter-arm64.exe" .
      - name: Install from source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DEEPROUTER_NO_SETUP=1 sh install.sh --prefix "$RUNNER_TEMP/bin" --from-source
          "$RUNNER_TEMP/bin/deeprouter-setup" version
      - name: Install from source (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DEEPROUTER_NO_SETUP = '1'
          $env:DEEPROUTER_NO_PATH = '1'
          $env:DEEPROUTER_SETUP_PREFIX = Join-Path $env:RUNNER_TEMP 'deeprouter-bin'
          & .\install.ps1
          & (Join-Path $env:DEEPROUTER_SETUP_PREFIX 'deeprouter.exe') version
