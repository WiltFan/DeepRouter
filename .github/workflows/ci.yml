name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: gofmt
        if: runner.os != 'Windows'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Install from source
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DEEPROUTER_NO_SETUP=1 sh install.sh --prefix "$RUNNER_TEMP/bin" --from-source
          "$RUNNER_TEMP/bin/deeprouter-setup" version
