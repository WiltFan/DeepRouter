name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      # install.sh and install.ps1 download plain binaries, not archives:
      #   https://github.com/<repo>/releases/download/v<version>/deeprouter-setup-<os>-<arch>[.exe]
      # and checksums.txt, where each line is "<sha256>  <asset name>".
      - name: Build static binaries
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p dist
          ldflags="-s -w -X main.version=${version}"
          assets=""
          for pair in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            name="deeprouter-setup-${os}-${arch}"
            if [ "$os" = windows ]; then
              name="${name}.exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "dist/${name}" .
            assets="${assets} ${name}"
          done
          (
            cd dist
            # shellcheck disable=SC2086
            sha256sum $assets > checksums.txt
          )
          awk 'NF != 2 { print "bad checksum line: " $0; exit 1 }' dist/checksums.txt
          grep -q 'deeprouter-setup-windows-amd64.exe' dist/checksums.txt
          grep -q 'deeprouter-setup-windows-arm64.exe' dist/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "$(printf 'deeprouter-setup %s\n\nStatic binaries (CGO_ENABLED=0) for darwin/amd64, darwin/arm64, linux/amd64, linux/arm64, windows/amd64, and windows/arm64. Windows assets are .exe files, not zip archives, matching the other plain binaries. install.sh and install.ps1 download these files as-is and verify them with checksums.txt.\n' "$version")" \
            dist/deeprouter-setup-darwin-amd64 \
            dist/deeprouter-setup-darwin-arm64 \
            dist/deeprouter-setup-linux-amd64 \
            dist/deeprouter-setup-linux-arm64 \
            dist/deeprouter-setup-windows-amd64.exe \
            dist/deeprouter-setup-windows-arm64.exe \
            dist/checksums.txt
